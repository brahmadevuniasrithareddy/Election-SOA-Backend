# =========================================================
# API GATEWAY
# =========================================================

spring.application.name=api-gateway

server.port=8080


# =========================================================
# EUREKA SERVER
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true


# =========================================================
# AUTH SERVICE
# =========================================================

spring.cloud.gateway.mvc.routes[0].id=auth-service

spring.cloud.gateway.mvc.routes[0].uri=lb://AUTH-SERVICE

spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**


# =========================================================
# ELECTION SERVICE
# =========================================================

spring.cloud.gateway.mvc.routes[1].id=election-service

spring.cloud.gateway.mvc.routes[1].uri=lb://ELECTION-SERVICE

spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/elections/**,/api/parties/**,/api/candidates/**


# =========================================================
# VOTE SERVICE
# =========================================================

spring.cloud.gateway.mvc.routes[2].id=vote-service

spring.cloud.gateway.mvc.routes[2].uri=lb://VOTE-SERVICE

spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/votes/**


# =========================================================
# AUDIT SERVICE
# =========================================================

spring.cloud.gateway.mvc.routes[3].id=audit-service

spring.cloud.gateway.mvc.routes[3].uri=lb://AUDIT-SERVICE

spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/audit/**


# =========================================================
# CORS
# =========================================================

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:5173

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=*

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true